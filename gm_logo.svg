<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#071a10"/>
      <stop offset="100%" style="stop-color:#0a2a18"/>
    </linearGradient>
    <linearGradient id="border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4ade80"/>
      <stop offset="100%" style="stop-color:#22c55e"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- Border -->
  <rect width="512" height="512" rx="96" fill="none" stroke="url(#border)" stroke-width="14"/>
  <!-- Inner subtle glow ring -->
  <rect x="20" y="20" width="472" height="472" rx="80" fill="none" stroke="rgba(74,222,128,0.15)" stroke-width="4"/>
  <!-- GM letters -->
  <text x="256" y="310" 
    font-family="Georgia, serif" 
    font-size="260" 
    font-weight="900"
    fill="#4ade80"
    text-anchor="middle"
    letter-spacing="-8"
    style="filter:drop-shadow(0 0 24px rgba(74,222,128,0.5))">GM</text>
  <!-- Subtitle -->
  <text x="256" y="390"
    font-family="Arial, sans-serif"
    font-size="42"
    font-weight="700"
    fill="rgba(74,222,128,0.6)"
    text-anchor="middle"
    letter-spacing="8">2026</text>
</svg>